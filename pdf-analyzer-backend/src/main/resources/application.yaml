# ── Server ───────────────────────────────────────────────────
server:
  port: ${PORT:8080}
  servlet:
    context-path: /

# ── Spring ───────────────────────────────────────────────────
spring:
  config:
    import: optional:dotenv:.env
  application:
    name: pdf-analyzer-backend
  jackson:
    default-property-inclusion: non_null
    serialization:
      write-dates-as-timestamps: false
  task:
    execution:
      pool:
        core-size: 4
        max-size: 8
        queue-capacity: 50
      thread-name-prefix: analysis-

# ── Actuator ─────────────────────────────────────────────────
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: when-authorized

# ── PDF Download ──────────────────────────────────────────────
pdf:
  download:
    connect-timeout-ms: 15000
    read-timeout-ms: 60000
    max-size-bytes: 52428800
    max-redirects: 5
  processing:
    max-pages: 200
    max-text-chars: 40000
    low-text-threshold: 100
    ocr-enabled: true
    chunk-threshold-chars: 35000
    chunk-size-chars: 12000
    chunk-overlap-chars: 500
  ocr:
    tessdata-path: ${TESSERACT_DATA_PATH:}
    max-pages: 10

# ── AI Provider ───────────────────────────────────────────────
ai:
  provider: ${AI_PROVIDER:auto}
  analysis:
    chunk-threshold-chars: 12000
    chunk-size-chars: 8000
    max-chunks: 8

# ── Gemini ────────────────────────────────────────────────────
gemini:
  api:
    key: ${GEMINI_API_KEY:}
    base-url: https://generativelanguage.googleapis.com/v1beta
    model: gemini-2.5-flash
    max-output-tokens: 1024
    temperature: 0.2

# ── OpenAI (fallback) ─────────────────────────────────────────
openai:
  api:
    key: ${GPT_API_KEY:}
    base-url: https://api.openai.com/v1
    model: gpt-4o-mini
    max-output-tokens: 1024
    temperature: 0.2

# ── CORS ──────────────────────────────────────────────────────
cors:
  allowed-origins: ${ALLOWED_ORIGINS:http://localhost:4200}

# ── Logging ───────────────────────────────────────────────────
logging:
  level:
    com.pdfanalyzer: INFO
    org.springframework.web: WARN
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"