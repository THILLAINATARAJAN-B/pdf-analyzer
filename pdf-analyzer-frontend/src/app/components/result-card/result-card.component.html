<div class="results" role="region" aria-label="Document analysis results">

  <!-- Row 1: doc type + authors -->
  <div class="row-two">
    <div class="result-item">
      <div class="item-top">
        <div class="item-icon icon-type" aria-hidden="true">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 6h16M4 12h16M4 18h7"/></svg>
        </div>
        <span class="item-label">Document type</span>
      </div>
      <div class="type-pill">{{ result.documentType }}</div>
    </div>

    <div class="result-item">
      <div class="item-top">
        <div class="item-icon icon-authors" aria-hidden="true">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>
        </div>
        <span class="item-label">Authors</span>
      </div>
      <p class="item-value authors-value">{{ result.authors }}</p>
    </div>
  </div>

  <!-- Title -->
  <div class="result-item">
    <div class="item-top">
      <div class="item-icon icon-title" aria-hidden="true">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="4 7 4 4 20 4 20 7"/><line x1="9" y1="20" x2="15" y2="20"/><line x1="12" y1="4" x2="12" y2="20"/></svg>
      </div>
      <span class="item-label">Title</span>
    </div>
    <p class="item-value title-value">{{ result.title }}</p>
  </div>

  <!-- Summary -->
  <div class="result-item">
    <div class="item-top">
      <div class="item-icon icon-summary" aria-hidden="true">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/></svg>
      </div>
      <span class="item-label">Summary</span>
    </div>
    <p class="item-value summary-value">{{ result.summary }}</p>
  </div>

  <!-- Key takeaway -->
  <div class="result-item takeaway-item">
    <div class="item-top">
      <div class="item-icon icon-takeaway" aria-hidden="true">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 2a7 7 0 0 1 7 7c0 2.38-1.19 4.47-3 5.74V17a1 1 0 0 1-1 1H9a1 1 0 0 1-1-1v-2.26C6.19 13.47 5 11.38 5 9a7 7 0 0 1 7-7z"/><line x1="9" y1="21" x2="15" y2="21"/></svg>
      </div>
      <span class="item-label">Key takeaway</span>
    </div>
    <p class="item-value takeaway-value">{{ result.keyTakeaway }}</p>
  </div>

</div>
